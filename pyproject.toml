[project]
name = "mordee-x-notebooks"
version = "0.1.0"
description = "Python ML notebooks for MorDee+ Phase 2 — synthetic data, no-show prediction, demand forecast, symptom KB embeddings."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "prophet>=1.1.5",
    "statsmodels>=0.14",
    "shap>=0.46",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "holidays>=0.57",
    "python-dotenv>=1.0",
    "google-genai>=0.4",
    "pydantic>=2.8",
]

[tool.uv]
package = false
